<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>A Message For You</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main class="message-container">

        <div class="message-number" id="messageNumber">
            MESSAGE 01
        </div>

        <h1 id="messageTitle">
            Open when you need a reminder
        </h1>

        <p class="date" id="messageDate">
            September 20, 2026
        </p>

        <div class="divider"></div>

        <p class="intro" id="messageIntro">
            I made this one just for you.
        </p>

        <audio
            id="audioPlayer"
            controls
        >
            <source
                id="audioSource"
                src="audio/test.m4a"
                type="audio/mp4"
            >

            Your browser does not support audio.
        </audio>

        <p class="footer">
            Made for you ♡
        </p>

    </main>


    <script src="script.js"></script>

</body>

</html>
