<!DOCTYPE html>

<html lang="en">

<head>

    <!--
    ====================================================
    BASIC PAGE INFORMATION
    ====================================================
    -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Celebrating Forever</title>

    <link
        rel="stylesheet"
        href="styles/styles.css"
    >

</head>


<body class="message-page">


    <!--
    ====================================================
    MENU BUTTON
    ====================================================
    -->

    <button
        class="menu-button menu-button--dark"
        id="menuButton"
        type="button"
        aria-label="Open navigation menu"
        aria-expanded="false"
        aria-controls="navigationDrawer"
    >

        <span class="menu-icon" aria-hidden="true">

            <span></span>
            <span></span>
            <span></span>

        </span>

        <span class="menu-label">
            Menu
        </span>

    </button>


    <!--
    ====================================================
    NAVIGATION
    ====================================================
    -->

    <div
        class="navigation-overlay"
        id="navigationOverlay"
    ></div>


    <nav
        class="navigation-drawer"
        id="navigationDrawer"
        aria-label="Main navigation"
    >

        <button
            class="navigation-close"
            id="closeMenuButton"
            type="button"
            aria-label="Close navigation menu"
        >
            ×
        </button>


        <p class="navigation-eyebrow">
            Celebrating Forever
        </p>


        <a
            class="navigation-link"
            href="index.html"
        >
            Home
        </a>


        <a
            class="navigation-link"
            href="collection.html"
        >
            Messages I've Found
        </a>


        <a
            class="navigation-link"
            href="message.html?m=7KQ3A"
            data-development-only
        >
            Message Template
        </a>

    </nav>


    <!--
    ====================================================
    MESSAGE ENVIRONMENT
    ====================================================
    -->

    <main class="message-environment">


        <!-- Temporary decorative background elements -->

        <div
            class="academic-shape academic-shape--left"
            aria-hidden="true"
        ></div>

        <div
            class="academic-shape academic-shape--right"
            aria-hidden="true"
        ></div>


        <div
            class="floral-haze floral-haze--top"
            aria-hidden="true"
        ></div>

        <div
            class="floral-haze floral-haze--bottom"
            aria-hidden="true"
        ></div>


        <!--
        =================================================
        NORMAL MESSAGE CONTENT
        =================================================

        JavaScript will fill the blank elements below.
        -->

        <article
            class="message-card"
            id="messageCard"
        >


            <p
                class="message-number"
                id="messageNumber"
            >
                Message
            </p>


            <h1
                class="message-title"
                id="messageTitle"
            >
                Loading your message...
            </h1>


            <p
                class="message-description"
                id="messageDescription"
            >
                Just a moment.
            </p>


            <div
                class="message-divider"
                aria-hidden="true"
            ></div>


            <!--
            OPTIONAL MESSAGE PHOTO

            JavaScript hides this entire container when
            the message's image property is null.
            -->

            <figure
                class="message-photo-container"
                id="messagePhotoContainer"
                hidden
            >

                <img
                    class="message-photo"
                    id="messagePhoto"
                    src=""
                    alt=""
                >

            </figure>


            <!--
            AUDIO PLAYER

            JavaScript dynamically inserts the correct
            audio filename into #messageAudioSource.
            -->

            <audio
                class="message-audio"
                id="messageAudio"
                controls
                preload="metadata"
            >

                <source
                    id="messageAudioSource"
                    src=""
                    type="audio/mp4"
                >

                Your browser does not support audio playback.

            </audio>


            <div
                class="earbud-placeholder"
                aria-hidden="true"
            >
                decorative wired earbuds
            </div>


        </article>


        <!--
        =================================================
        ERROR STATE
        =================================================

        This appears only if the URL contains an invalid
        or missing message ID.

        It starts hidden.
        -->

        <section
            class="message-error"
            id="messageError"
            hidden
        >

            <p class="message-error-symbol">
                ♡
            </p>

            <h1>
                This note couldn't be found.
            </h1>

            <p>
                Try opening the message again from the
                link you were given.
            </p>

            <a
                href="index.html"
                class="message-error-link"
            >
                Return home
            </a>

        </section>


    </main>


    <!--
    ====================================================
    JAVASCRIPT LOAD ORDER
    ====================================================

    1. site-config.js
       Loads website-wide settings.

    2. messages.js
       Loads your voice-message database.

    3. shared.js
       Loads menu/global behavior.

    4. message.js
       Reads the URL and loads the correct message.

    Order matters.
    -->

    <script src="scripts/site-config.js"></script>

    <script src="scripts/messages.js"></script>

    <script src="scripts/storage.js"></script>

    <script src="scripts/shared.js"></script>

    <script src="scripts/message.js"></script>

</body>

</html>
